<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>邮件编辑器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      background-color: #f5f5f5;
      padding: 20px;
    }

    .email-container {
      width: 100%;
      max-width: 800px;
      background-color: #f7f7f7;
      border: 1px solid #dcdcdc;
      font-size: 13px;
      color: #333;
    }

    /* 每一行输入框容器 */
    .form-row {
      display: flex;
      align-items: center;
      min-height: 38px;
      border-bottom: 1px solid #e2e2e2;
      background-color: #fbfbfb;
      padding: 4px 8px;
    }

    /* 左侧 Label */
    .label-container {
      width: 90px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      color: #333;
      user-select: none;
    }

    .arrow {
      display: inline-block;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 5px solid #666;
      margin-right: 6px;
    }

    /* 右侧输入区域 */
    .input-container {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background-color: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 2px;
      min-height: 28px;
      padding: 2px 6px;
    }

    /* 收件人 Tag */
    .tag {
      display: inline-flex;
      align-items: center;
      background-color: #f0f0f0;
      border: 1px solid #d9d9d9;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      color: #333;
    }

    .tag .close-btn {
      margin-left: 6px;
      cursor: pointer;
      color: #999;
      font-size: 12px;
      font-weight: bold;
    }

    .tag .close-btn:hover {
      color: #666;
    }

    /* 工具栏 */
    .toolbar {
      display: flex;
      align-items: center;
      height: 36px;
      background-color: #ececec;
      border-top: 1px solid #d0d0d0;
      padding: 0 8px;
      gap: 4px;
      user-select: none;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 26px;
      min-width: 26px;
      padding: 0 4px;
      border-radius: 2px;
      cursor: pointer;
      color: #555;
      font-size: 13px;
    }

    .tool-btn:hover {
      background-color: #e0e0e0;
    }

    .tool-select {
      height: 24px;
      border: 1px solid #d0d0d0;
      background-color: #fff;
      border-radius: 2px;
      padding: 0 4px;
      font-size: 12px;
      color: #333;
      outline: none;
    }

    .separator {
      width: 1px;
      height: 16px;
      background-color: #ccc;
      margin: 0 4px;
    }

    /* 特定图标与高亮样式 */
    .btn-active {
      background-color: #dcdcdc;
    }

    .underline-text {
      text-decoration: underline;
    }

    .strikethrough-text {
      text-decoration: line-through;
    }

    .color-picker {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }

    .color-bar {
      width: 10px;
      height: 2px;
      background-color: #000;
      margin-top: 1px;
    }
  </style>
</head>
<body>

<div class="email-container">
  <!-- 收件人行 -->
  <div class="form-row">
    <div class="label-container">
      <span>收件人(2)</span>
    </div>
    <div class="input-container">
      <div class="tag">
        <span>"张三" &lt;zhangsan@example.com&gt;</span>
        <span class="close-btn">×</span>
      </div>
      <div class="tag">
        <span>"李四" &lt;lisi@example.com&gt;</span>
        <span class="close-btn">×</span>
      </div>
    </div>
  </div>

  <!-- 抄送行 -->
  <div class="form-row">
    <div class="label-container">
      <span class="arrow"></span>
      <span>抄送</span>
    </div>
    <div class="input-container"></div>
  </div>

  <!-- 主题行 -->
  <div class="form-row">
    <div class="label-container">
      <span>主题</span>
    </div>
    <div class="input-container"></div>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <!-- 撤销 / 重做 -->
    <div class="tool-btn" title="撤销">↩</div>
    <div class="tool-btn" title="重做">↪</div>
    <div class="tool-btn" title="清除格式">🧹</div>
    <div class="tool-btn" title="格式刷">🖌️</div>
    <div class="tool-btn" title="剪贴板">📋</div>

    <div class="separator"></div>

    <!-- 文本类型下拉框 -->
    <select class="tool-select">
      <option>正文</option>
    </select>

    <!-- 字体下拉框 -->
    <select class="tool-select">
      <option>默认字体</option>
    </select>

    <!-- 字号下拉框 -->
    <select class="tool-select">
      <option>小四</option>
    </select>

    <div class="separator"></div>

    <!-- 样式按钮 -->
    <div class="tool-btn" style="font-weight: bold;" title="加粗">B</div>
    <div class="tool-btn" style="font-style: italic; font-family: Georgia, serif;" title="斜体">I</div>
    <div class="tool-btn underline-text" title="下划线">U</div>
    <div class="tool-btn strikethrough-text" title="删除线">S</div>
    <div class="tool-btn btn-active" title="链接">🔗</div>
    <div class="tool-btn" title="下标">X<sub>2</sub></div>
    <div class="tool-btn" title="上标">X<sup>2</sup></div>

    <div class="separator"></div>

    <!-- 颜色选择 -->
    <div class="tool-btn" title="字体颜色">
      <div class="color-picker">
        <span style="font-weight: bold;">A</span>
        <div class="color-bar"></div>
      </div>
    </div>
    <div class="tool-btn" title="背景颜色">
      <div class="color-picker">
        <span style="background-color: #d0d0d0; padding: 0 2px;">A</span>
        <div class="color-bar" style="background-color: transparent;"></div>
      </div>
      <span style="font-size: 8px; margin-left: 2px;">▼</span>
    </div>
  </div>
</div>

</body>
</html>
